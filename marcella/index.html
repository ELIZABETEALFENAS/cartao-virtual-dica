<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="Marcella Quevedo">
<title>Marcella Quevedo | Contadora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e131b; --card:#161d29; --line:#2a3445; --ink:#f2efe8; --muted:#a9a59c;
    --gold:#e0a33e; --btn:#1c2433; --btn-h:#243044;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
  .card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);
    border-radius:20px;padding:20px 20px 28px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.45)}
  .logo{display:block;width:100%;border-radius:14px;margin:0 0 22px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
  h1{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:34px;letter-spacing:.3px}
  .role{margin-top:6px;font-size:13px;letter-spacing:3px;text-transform:uppercase;color:var(--gold)}
  .org{margin-top:10px;font-size:14px;color:var(--muted)}
  .sep{width:48px;height:1px;background:var(--gold);margin:24px auto;opacity:.7}
  .links{display:flex;flex-direction:column;gap:10px}
  a.btn,button.btn{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;border-radius:12px;
    background:var(--btn);border:1px solid var(--line);color:var(--ink);text-decoration:none;
    font:500 15px Inter,sans-serif;cursor:pointer;text-align:left;transition:background .15s}
  a.btn:hover,button.btn:hover{background:var(--btn-h)}
  .ic{width:22px;height:22px;flex:none;stroke:var(--gold);fill:none;stroke-width:1.6}
  .lbl{display:flex;flex-direction:column;min-width:0}
  .lbl small{font-size:11px;color:var(--muted);letter-spacing:.5px;text-transform:uppercase}
  .lbl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  button.save{margin-top:18px;justify-content:center;background:var(--gold);color:#15130f;border:none;font-weight:600}
  button.save:hover{background:#eab35a}
  footer{margin-top:22px;font-size:12px;color:var(--muted)}
</style>
</head>
